[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "yt-dlp-gui"
version = "0.1.0"
description = "A monumental video archive interface for yt-dlp"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.0",
    "yt-dlp>=2024.1.0",
]

[project.scripts]
yt-dlp-gui = "yt_dlp_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yt_dlp_gui = ["assets/*"]